<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Официальный Гарант</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        body { 
            background-color: #000000; 
            color: #ffffff; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Окно расписки */
        .receipt {
            background: #ffffff; 
            color: #000000;
            width: 100%; 
            max-width: 400px;
            border-radius: 16px;
            padding: 30px 24px;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            font-family: 'Courier New', Courier, monospace;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Зубчатые края как у чека */
        .receipt::before, .receipt::after {
            content: ''; position: absolute; left: 0; width: 100%; height: 10px;
            background-size: 20px 20px;
            background-image: radial-gradient(circle, transparent 10px, #ffffff 11px);
            background-position: 0 -10px;
        }
        .receipt::before { top: -10px; transform: rotate(180deg); }
        .receipt::after { bottom: -10px; }

        .receipt h2 { 
            text-align: center; 
            font-size: 20px; 
            margin-bottom: 20px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            border-bottom: 2px dashed #ccc; 
            padding-bottom: 15px;
            font-weight: 900;
        }
        
        .receipt-row { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 15px; 
            font-size: 15px; 
            font-weight: 600;
        }
        
        .receipt-row span:last-child { 
            font-weight: normal; 
            text-align: right; 
            max-width: 60%;
        }
        
        .receipt-footer { 
            margin-top: 25px; 
            text-align: center; 
            font-size: 13px; 
            color: #444; 
            border-top: 2px dashed #ccc; 
            padding-top: 15px;
            line-height: 1.5;
        }
        
        .status-green {
            color: #16a34a;
            font-weight: bold;
        }

        /* Кнопка */
        .btn-close-receipt {
            background: #000; 
            color: #fff; 
            border: none; 
            border-radius: 12px;
            padding: 16px; 
            width: 100%; 
            margin-top: 25px; 
            font-weight: bold; 
            font-size: 15px; 
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-close-receipt:active { background: #333; }
    </style>
</head>
<body>
    <div class="receipt">
        <h2>ОФИЦИАЛЬНЫЙ ГАРАНТ</h2>
        
        <div class="receipt-row">
            <span>Статус:</span>
            <span class="status-green">ДЕЙСТВИТЕЛЕН</span>
        </div>
        
        <div class="receipt-row">
            <span>Бот:</span>
            <span>@Offertelegrammbot</span>
        </div>
        
        <div class="receipt-row">
            <span>Гарант:</span>
            <span>Майор (Support)</span>
        </div>
        
        <div class="receipt-row">
            <span>Безопасность:</span>
            <span>100% Защита</span>
        </div>

        <div class="receipt-footer">
            <p>✅ Данный бот прошел официальную верификацию.</p>
            <p>🔒 Все транзакции контролируются службой безопасности.</p>
            <p style="margin-top: 10px; color: #b91c1c; font-weight: bold;">⚠️ Любые попытки мошенничества приведут к блокировке аккаунта.</p>
        </div>
        
        <button class="btn-close-receipt" onclick="closeApp()">Понятно, закрыть</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');

        // Вибро-отклик при загрузке
        tg.HapticFeedback.notificationOccurred('success');

        function closeApp() {
            tg.HapticFeedback.impactOccurred('medium');
            tg.close(); // Закрывает веб-приложение
        }
    </script>
</body>
</html>
