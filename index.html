<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portals Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        body { 
            background-color: #000000; 
            color: #ffffff; 
            overflow-x: hidden;
        }

        /* --- ЭКРАН ЗАГРУЗКИ (КАК НА 2 СКРИНЕ) --- */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #102a63 0%, #000000 70%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }

        .logo-text { font-size: 32px; font-weight: 900; letter-spacing: 1px; margin-bottom: 50px; text-shadow: 0 0 20px rgba(59,130,246,0.5); }
        
        .icons-container { position: relative; width: 220px; height: 220px; display: flex; justify-content: center; align-items: center; }
        
        .floating-icon {
            position: absolute; width: 50px; height: 50px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            animation: float 3s infinite ease-in-out alternate;
        }

        /* Позиции иконок вокруг центра */
        .floating-icon:nth-child(1) { top: 0; left: 30px; background: #ff4d4d; animation-delay: 0s; }
        .floating-icon:nth-child(2) { top: 40px; right: 10px; background: #ffcc00; animation-delay: 0.5s; }
        .floating-icon:nth-child(3) { bottom: 60px; left: 0; background: #9933ff; animation-delay: 1s; }
        .floating-icon:nth-child(4) { bottom: 10px; right: 30px; background: #00ccff; animation-delay: 1.5s; }
        .floating-icon:nth-child(5) { top: 80px; left: 0; background: #ff9933; animation-delay: 2s; }

        .center-frog { font-size: 100px; z-index: 2; filter: drop-shadow(0 0 20px #3b82f6); }

        @keyframes float { 0% { transform: translateY(0px); } 100% { transform: translateY(-15px); } }

        .loading-bar { width: 100px; height: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-top: 50px; overflow: hidden; }
        .progress { width: 0%; height: 100%; background: #fff; border-radius: 2px; animation: load 2s forwards; }
        @keyframes load { 0% { width: 0%; } 100% { width: 100%; } }

        /* --- ОСНОВНОЙ ИНТЕРФЕЙС (КАК НА 1 СКРИНЕ) --- */
        #app { display: none; padding: 16px; padding-bottom: 90px; }

        /* Шапка с балансом */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .user-info { display: flex; align-items: center; gap: 8px; }
        .avatar { width: 24px; height: 24px; border-radius: 50%; background: #333; }
        .balance-badge { background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }

        /* Банера */
        .banners { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; scrollbar-width: none; }
        .banners::-webkit-scrollbar { display: none; }
        .banner { min-width: 200px; height: 80px; border-radius: 12px; background: linear-gradient(135deg, #2b1b4d, #6d28d9); display: flex; align-items: center; padding: 12px; font-weight: bold; font-size: 14px; color: #fff; }
        .banner:nth-child(2) { background: linear-gradient(135deg, #1b2b4d, #2563eb); }

        /* Поиск и фильтры */
        .search-bar { background: #1c1c1e; border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 8px; color: #8e8e93; font-size: 14px; margin-bottom: 12px; }
        .filters { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
        .filter-btn { background: #1c1c1e; padding: 6px 12px; border-radius: 16px; font-size: 12px; color: #fff; white-space: nowrap; }

        /* Сетка подарков */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        
        .card { background: transparent; display: flex; flex-direction: column; position: relative; }
        .img-container { background: #1c1c1e; border-radius: 12px; aspect-ratio: 1; display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 6px; overflow: hidden;}
        .img-container img { width: 80%; height: 80%; object-fit: contain; }
        
        /* Иконка замочка */
        .lock { position: absolute; top: 6px; right: 6px; font-size: 10px; color: rgba(255,255,255,0.5); }
        
        .card .title { font-size: 11px; font-weight: 500; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        
        /* Плашка с ценой */
        .price-tag { background: #2c2c2e; padding: 4px 6px; border-radius: 8px; font-size: 10px; font-weight: 700; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .price-tag .lock-icon { font-size: 10px; color: #8e8e93; }

        /* Нижнее меню */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1c1c1e; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #2c2c2e; z-index: 100; }
        .nav-item { color: #8e8e93; font-size: 10px; text-align: center; }
        .nav-item.active { color: #fff; }
        .nav-icon { font-size: 18px; margin-bottom: 2px; }
    </style>
</head>
<body>
    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div id="splash">
        <div class="logo-text">Portals</div>
        <div class="icons-container">
            <div class="floating-icon">🎁</div>
            <div class="floating-icon">🍩</div>
            <div class="floating-icon">👑</div>
            <div class="floating-icon">🐸</div>
            <div class="floating-icon">🪙</div>
            <div class="center-frog">👾</div> <!-- Заглушка вместо жабы -->
        </div>
        <div class="loading-bar"><div class="progress"></div></div>
    </div>

    <!-- САМ МАГАЗИН -->
    <div id="app">
        <div class="top-bar">
            <div class="user-info">
                <div class="avatar"></div>
                <span style="font-size: 12px; font-weight: 600;">Portals Market</span>
            </div>
            <div class="balance-badge">🪙 0 GRAM</div>
        </div>

        <div class="banners">
            <div class="banner">Play With ⭐ Stars</div>
            <div class="banner">Gifts Staking</div>
        </div>

        <div class="search-bar">
            <span>🔍 Quick find</span>
        </div>

        <div class="filters">
            <div class="filter-btn">Collection ⌄</div>
            <div class="filter-btn">Model ⌄</div>
            <div class="filter-btn">Back ⌄</div>
            <div class="filter-btn">Symbol ⌄</div>
        </div>

        <!-- Сетка товаров -->
        <div class="grid" id="grid">
            <!-- Генерируется через JS -->
        </div>

        <div class="bottom-nav">
            <div class="nav-item active"><div class="nav-icon">🛍️</div>All</div>
            <div class="nav-item"><div class="nav-icon">👤</div>Collections</div>
            <div class="nav-item"><div class="nav-icon">⭐</div>Stars</div>
            <div class="nav-item"><div class="nav-icon">🎁</div>Craft</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');

        // Задержка загрузки
        setTimeout(() => {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            }, 500);
        }, 2000);

        // Товары (как на скрине)
        const products = [
            { id: 1, name: "Stellar Rocket", price: "12.00", img: "🚀" },
            { id: 2, name: "Ice Cream", price: "5.00", img: "🍦" },
            { id: 3, name: "Desk Calendar", price: "17.00", img: "📅" },
            { id: 4, name: "Pool Float", price: "6.00", img: "🦄" },
            { id: 5, name: "Input Key", price: "8.00", img: "🔑" },
            { id: 6, name: "Snoop Dogg", price: "6.00", img: "🐶" },
            { id: 7, name: "Hex Pot", price: "6.00", img: "🍲" },
            { id: 8, name: "Surge Board", price: "12.00", img: "🛹" },
            { id: 9, name: "Mousse Cake", price: "8.00", img: "🍰" }
        ];

        const grid = document.getElementById('grid');
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="img-container" onclick="buyProduct(${p.id}, '${p.name}')">
                    <span style="font-size: 40px;">${p.img}</span>
                    <div class="lock">🔒</div>
                </div>
                <div class="title">${p.name}</div>
                <div class="price-tag">
                    <span>${p.price} ⭐</span>
                    <span class="lock-icon">🔒</span>
                </div>
            `;
            grid.appendChild(card);
        });

        function buyProduct(id, name) {
            tg.HapticFeedback.impactOccurred('medium');
            tg.sendData(JSON.stringify({ action: "buy", product_id: id, product_name: name }));
        }
    </script>
</body>
</html>
